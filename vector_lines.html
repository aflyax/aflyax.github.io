<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vector Wave Field</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 50%, #010203 0%, #000 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      width: min(94vmin, 1100px);
      height: min(94vmin, 1100px);
      display: block;
    }
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 8px;
      color: white;
      min-width: 250px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      opacity: 0.8;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-group .value {
      display: inline-block;
      margin-left: 10px;
      font-weight: bold;
    }
    .control-group input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .checkbox-label {
      cursor: pointer;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <canvas id="c" width="1100" height="1100"></canvas>
  
  <div class="controls">
    <div class="control-group" style="text-align: center; margin-bottom: 15px; font-style: italic; opacity: 0.9;">
      Click/drag anywhere to play notes
    </div>
    
    <div class="control-group" style="display: flex; gap: 10px; align-items: center;">
      <label class="checkbox-label" style="flex: 0 0 auto; margin: 0;">
        <input type="checkbox" id="enableSound">
        Enable Sound
      </label>
      <select id="instrumentSelect" style="flex: 1; padding: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; cursor: pointer;">
        <option value="choir">Angelic Choir</option>
        <option value="cello" selected>Cello</option>
        <option value="bansuri">Bansuri (Indian Flute)</option>
        <option value="accordion">Accordion</option>
      </select>
    </div>
    
    <div class="control-group">
      <label class="checkbox-label">
        <input type="checkbox" id="colorfulLines" checked>
        Colorful Lines
      </label>
    </div>
    
    <div class="control-group">
      <label>Line Size: <span class="value" id="lineSizeValue">1.0x</span></label>
      <input type="range" id="lineSize" min="0.5" max="2" step="0.1" value="1">
    </div>
    
    <div class="control-group">
      <label>Min Speed: <span class="value" id="minSpeedValue">0.04</span></label>
      <input type="range" id="minSpeed" min="0.001" max="0.05" step="0.001" value="0.04">
    </div>
    
    <div class="control-group">
      <label>Max Speed Boost: <span class="value" id="maxSpeedValue">1.1x</span></label>
      <input type="range" id="maxSpeed" min="1" max="1.5" step="0.05" value="1.1">
    </div>
    
    <div class="control-group">
      <label>Density: <span class="value" id="densityValue">0.75</span></label>
      <input type="range" id="density" min="0.125" max="1" step="0.025" value="0.75">
    </div>
    
    <div class="control-group">
      <label>Zoom: <span class="value" id="zoomValue">1.00</span></label>
      <input type="range" id="zoomControl" min="0.125" max="1" step="0.025" value="1">
    </div>
    
    <div class="control-group">
      <label>Trail Length: <span class="value" id="trailValue">Medium</span></label>
      <input type="range" id="trailControl" min="0" max="2" step="0.1" value="1">
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    let zoom = 1.0; // Start at max zoom out (1.0)
    let offsetX = 0, offsetY = 0;
    const baseSpacing = 15;
    let t = 0;
    
    // Control variables
    let lineSizeMultiplier = 1; // Start at 1x line size
    let minSpeed = 0.04;
    let maxSpeedBoost = 1.1;
    let baseSpacingMultiplier = 0.75; // Start at 0.75 density
    let colorfulLines = true; // Toggle between colorful lines or grayscale lines
    let soundEnabled = false; // Default to sound off
    let currentInstrument = 'cello'; // Default to cello
    let trailLength = 1; // Trail discreteness: 0 = very wispy, 1 = medium, 2 = discrete (no wisps)
    
    // Web Audio API setup
    let audioContext = null;
    let oscillators = [];
    let gainNodes = [];
    let masterGain = null;
    let reverbNode = null;
    let filterNode = null;
    let lastOscillatorCheck = 0;
    let soundRestartTimer = null;
    let lastSoundStartTime = 0;
    
    function stopAllAmbientOscillators() {
      // Clear any existing restart timer
      if (soundRestartTimer) {
        clearTimeout(soundRestartTimer);
        soundRestartTimer = null;
      }
      
      oscillators.forEach(osc => {
        try {
          // Schedule stop slightly in the future to avoid clicks
          osc.stop(audioContext.currentTime + 0.1);
          osc.disconnect();
        } catch(e) {
          // Oscillator may already be stopped
        }
      });
      gainNodes.forEach(gain => {
        try {
          gain.disconnect();
        } catch(e) {}
      });
      oscillators = [];
      gainNodes = [];
    }
    
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Create reverb using convolver
        reverbNode = audioContext.createConvolver();
        const reverbTime = 3;
        const sampleRate = audioContext.sampleRate;
        const length = sampleRate * reverbTime;
        const impulse = audioContext.createBuffer(2, length, sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
          const channelData = impulse.getChannelData(channel);
          for (let i = 0; i < length; i++) {
            channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
          }
        }
        reverbNode.buffer = impulse;
        
        // Soft lowpass filter for warmth - higher cutoff for more shimmer
        filterNode = audioContext.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 3500;
        filterNode.Q.value = 0.3; // Gentler slope for smoother sound
        
        // Master gain
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.15; // Slightly louder for fuller presence
        
        // Connect reverb and filter to output
        filterNode.connect(reverbNode);
        reverbNode.connect(masterGain);
        masterGain.connect(audioContext.destination);
      }
      
      startAmbientSound();
    }
    
    function startAmbientSound() {
      if (!audioContext) return;
      
      stopAllAmbientOscillators();
      
      const now = audioContext.currentTime;
      lastSoundStartTime = Date.now();
      
      // Schedule automatic restart after exactly 2 minutes (120 seconds)
      soundRestartTimer = setTimeout(() => {
        console.log('2 minutes elapsed - restarting ambient sound');
        if (soundEnabled && audioContext) {
          startAmbientSound();
        }
      }, 120000); // 120,000 milliseconds = 2 minutes
      
      console.log('Starting ambient sound - will restart in 2 minutes');
      
      if (currentInstrument === 'choir') {
        // Create choir voices - Rich C major chord with perfect intervals for angelic sound
        // Using C major triad (C-E-G) with octaves and fifths for harmonic richness
        const voiceFrequencies = [
          130.81,  // C3 - Deep foundation
          164.81,  // E3 - Third
          196.00,  // G3 - Fifth
          261.63,  // C4 - Root (middle)
          329.63,  // E4 - Third (middle)
          392.00,  // G4 - Fifth (middle)
          523.25,  // C5 - High octave for brightness
        ];
        
        voiceFrequencies.forEach((freq, index) => {
          // Each voice has multiple oscillators for lush chorus effect
          // Using smaller detune amounts for smoother blend
          for (let detuneAmount of [-2, -0.5, 0, 0.5, 2]) {
            const osc = audioContext.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.detune.value = detuneAmount;
            
            const gain = audioContext.createGain();
            // Lower individual volume since we have more oscillators
            // Emphasize middle voices, softer on extremes
            if (freq < 200) {
              gain.gain.value = 0.015; // Subtle bass
            } else if (freq > 500) {
              gain.gain.value = 0.018; // Gentle high shimmer
            } else {
              gain.gain.value = 0.022; // Strong middle presence
            }
            
            osc.connect(gain);
            gain.connect(filterNode);
            osc.start(now);
            // Don't schedule stop - let oscillators run continuously until manually stopped
            
            // Add event listener to detect if oscillator ends unexpectedly
            osc.onended = () => {
              console.warn('Oscillator ended unexpectedly! Frequency:', freq, 'Detune:', detuneAmount);
            };
            
            oscillators.push(osc);
            gainNodes.push(gain);
          }
        });
      } else if (currentInstrument === 'cello') {
        // Cello uses sawtooth wave - C major diatonic scale
        const celloNotes = [65.41, 73.42, 82.41, 87.31, 98.00, 110.00]; // C2, D2, E2, F2, G2, A2
        
        celloNotes.forEach((freq, index) => {
          // Main oscillator with sawtooth wave
          const osc = audioContext.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          
          const gain = audioContext.createGain();
          gain.gain.value = 0.015; // Lower volume for sawtooth
          
          osc.connect(gain);
          gain.connect(filterNode);
          osc.start(now);
          // Don't schedule stop - let oscillators run continuously
          osc.onended = () => console.warn('Cello oscillator ended:', freq);
          
          oscillators.push(osc);
          gainNodes.push(gain);
          
          // Add subtle detuned layer for warmth
          const osc2 = audioContext.createOscillator();
          osc2.type = 'sawtooth';
          osc2.frequency.value = freq;
          osc2.detune.value = 5; // Slight detune
          
          const gain2 = audioContext.createGain();
          gain2.gain.value = 0.01;
          
          osc2.connect(gain2);
          gain2.connect(filterNode);
          osc2.start(now);
          // Don't schedule stop - let oscillators run continuously
          osc2.onended = () => console.warn('Cello oscillator 2 ended:', freq);
          
          oscillators.push(osc2);
          gainNodes.push(gain2);
        });
      } else if (currentInstrument === 'bansuri') {
        // Bansuri (Indian flute) - C major diatonic scale
        const bansuriNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00]; // C4, D4, E4, F4, G4, A4
        
        bansuriNotes.forEach((freq, index) => {
          // Main tone - pure sine with slight detune for warmth
          const osc = audioContext.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          const gain = audioContext.createGain();
          gain.gain.value = 0.025; // Slightly louder fundamental
          
          osc.connect(gain);
          gain.connect(filterNode);
          osc.start(now);
          
          oscillators.push(osc);
          gainNodes.push(gain);
          
          // Second fundamental with slight detune for chorus effect
          const osc2 = audioContext.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.value = freq;
          osc2.detune.value = 3; // Slight detune for warmth
          
          const gain2 = audioContext.createGain();
          gain2.gain.value = 0.02;
          
          osc2.connect(gain2);
          gain2.connect(filterNode);
          osc2.start(now);
          
          oscillators.push(osc2);
          gainNodes.push(gain2);
          
          // Octave harmonic for hollow flute character
          const harmonic = audioContext.createOscillator();
          harmonic.type = 'sine';
          harmonic.frequency.value = freq * 2.003; // Slightly detuned octave
          
          const harmonicGain = audioContext.createGain();
          harmonicGain.gain.value = 0.012; // More present octave
          
          harmonic.connect(harmonicGain);
          harmonicGain.connect(filterNode);
          harmonic.start(now);
          
          oscillators.push(harmonic);
          gainNodes.push(harmonicGain);
          
          // Third harmonic for brightness
          const harmonic2 = audioContext.createOscillator();
          harmonic2.type = 'sine';
          harmonic2.frequency.value = freq * 3.01; // Fifth above octave
          
          const harmonic2Gain = audioContext.createGain();
          harmonic2Gain.gain.value = 0.006; // Subtle brightness
          
          harmonic2.connect(harmonic2Gain);
          harmonic2Gain.connect(filterNode);
          harmonic2.start(now);
          
          oscillators.push(harmonic2);
          gainNodes.push(harmonic2Gain);
        });
      } else if (currentInstrument === 'accordion') {
        // Accordion - C major diatonic scale
        const accordionNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00]; // C4, D4, E4, F4, G4, A4
        
        accordionNotes.forEach((freq, index) => {
          // Main reedy voice
          for (let detuneAmount of [-8, 0, 8]) {
            const osc = audioContext.createOscillator();
            osc.type = 'square';
            osc.frequency.value = freq;
            osc.detune.value = detuneAmount;
            
            const gain = audioContext.createGain();
            gain.gain.value = 0.012;
            
            osc.connect(gain);
            gain.connect(filterNode);
            osc.start(now);
            // Don't schedule stop - let oscillators run continuously
            
            oscillators.push(osc);
            gainNodes.push(gain);
          }
        });
      }
    }
    
    function playRippleSound(x, y) {
      if (!audioContext) return;
      
      // Map Y position (0 to H) to note selection - INVERTED: top = high notes, bottom = low notes
      const normalizedY = 1 - (y / H); // 0 to 1, inverted so top = 1
      
      // Map X position (0 to W) to articulation - left = staccato (short), right = legato (long)
      const normalizedX = x / W; // 0 to 1
      
      let notes, waveType, harmonics;
      
      if (currentInstrument === 'choir') {
        // C major diatonic scale - pure stepwise motion for angelic sound
        notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99]; // C4-D4-E4-F4-G4-A4-B4-C5-D5-E5-F5-G5
        waveType = 'sine';
        harmonics = [1, 2, 3]; // Fundamental, octave, fifth above octave
      } else if (currentInstrument === 'cello') {
        // C major diatonic scale - extended cello range
        notes = [65.41, 73.42, 82.41, 87.31, 98.00, 110.00, 123.47, 130.81, 146.83, 164.81, 174.61, 196.00]; // C2-D2-E2-F2-G2-A2-B2-C3-D3-E3-F3-G3
        waveType = 'sawtooth';
        harmonics = [1]; // Sawtooth already has rich harmonics, don't need multiples
      } else if (currentInstrument === 'bansuri') {
        // C major diatonic scale - extended bansuri range
        notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99]; // C4-D4-E4-F4-G4-A4-B4-C5-D5-E5-F5-G5
        waveType = 'sine';
        harmonics = [1, 1.003, 2.003, 3.01]; // Fundamental with slight detune, octave, and third for flute character
      } else if (currentInstrument === 'accordion') {
        // C major diatonic scale - extended accordion range
        notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99]; // C4-D4-E4-F4-G4-A4-B4-C5-D5-E5-F5-G5
        waveType = 'square';
        harmonics = [1]; // Square wave already has strong harmonics
      }
      
      const noteIndex = Math.floor(normalizedY * notes.length);
      const frequency = notes[Math.min(noteIndex, notes.length - 1)];
      
      const now = audioContext.currentTime;
      const oscillatorsToCreate = [];
      
      harmonics.forEach((harmonic, idx) => {
        const osc = audioContext.createOscillator();
        osc.type = waveType;
        osc.frequency.value = frequency * harmonic;
        oscillatorsToCreate.push(osc);
      });
      
      const rippleGain = audioContext.createGain();
      
      // X-axis controls articulation: left = staccato (short), right = legato (long)
      // Duration ranges from 0.15s (very staccato) to 4s (very legato)
      const noteDuration = 0.15 + (normalizedX * 3.85); // 0.15s to 4s
      
      // Different envelopes for different instruments with articulation control
      if (currentInstrument === 'choir') {
        const attackTime = 0.02 + (normalizedX * 0.08); // 0.02s to 0.1s attack
        const decayTime = noteDuration * 0.3;
        const sustainLevel = 0.1 + (normalizedX * 0.05); // Higher sustain for legato
        const releaseTime = noteDuration * 0.7;
        
        rippleGain.gain.setValueAtTime(0, now);
        rippleGain.gain.linearRampToValueAtTime(0.15, now + attackTime);
        rippleGain.gain.linearRampToValueAtTime(sustainLevel, now + attackTime + decayTime);
        rippleGain.gain.exponentialRampToValueAtTime(0.001, now + noteDuration);
      } else if (currentInstrument === 'cello') {
        const attackTime = 0.05 + (normalizedX * 0.2); // 0.05s to 0.25s bow attack
        const decayTime = noteDuration * 0.2;
        const sustainLevel = 0.08 + (normalizedX * 0.04);
        const releaseTime = noteDuration * 0.8;
        
        rippleGain.gain.setValueAtTime(0, now);
        rippleGain.gain.linearRampToValueAtTime(0.12, now + attackTime);
        rippleGain.gain.linearRampToValueAtTime(sustainLevel, now + attackTime + decayTime);
        rippleGain.gain.exponentialRampToValueAtTime(0.001, now + noteDuration);
      } else if (currentInstrument === 'bansuri') {
        const attackTime = 0.06 + (normalizedX * 0.15); // 0.06s to 0.21s breathy attack
        const decayTime = noteDuration * 0.15;
        const sustainLevel = 0.09 + (normalizedX * 0.04); // Good sustain for flute
        const releaseTime = noteDuration * 0.85;
        
        rippleGain.gain.setValueAtTime(0, now);
        rippleGain.gain.linearRampToValueAtTime(0.16, now + attackTime); // Brighter for flute
        rippleGain.gain.linearRampToValueAtTime(sustainLevel, now + attackTime + decayTime);
        rippleGain.gain.exponentialRampToValueAtTime(0.001, now + noteDuration);
      } else if (currentInstrument === 'accordion') {
        const attackTime = 0.01 + (normalizedX * 0.03); // 0.01s to 0.04s quick bellows attack
        const decayTime = noteDuration * 0.15;
        const sustainLevel = 0.09 + (normalizedX * 0.05); // Strong sustain for accordion
        const releaseTime = noteDuration * 0.85;
        
        rippleGain.gain.setValueAtTime(0, now);
        rippleGain.gain.linearRampToValueAtTime(0.14, now + attackTime);
        rippleGain.gain.linearRampToValueAtTime(sustainLevel, now + attackTime + decayTime);
        rippleGain.gain.exponentialRampToValueAtTime(0.001, now + noteDuration);
      }
      
      oscillatorsToCreate.forEach(osc => {
        osc.connect(rippleGain);
      });
      rippleGain.connect(reverbNode);
      
      oscillatorsToCreate.forEach(osc => {
        osc.start(now);
        osc.stop(now + noteDuration);
      });
    }
    
    function updateSound() {
      if (!soundEnabled || !audioContext) return;
      
      const time = audioContext.currentTime;
      
      // Aggressively check if oscillators are still playing every 1 second
      if (time - lastOscillatorCheck > 1) {
        lastOscillatorCheck = time;
        
        // If we have no oscillators but sound is enabled, restart immediately
        if (oscillators.length === 0) {
          console.log('Restarting ambient sound - oscillators were lost');
          startAmbientSound();
          return;
        }
        
        // Also check if AudioContext got suspended and resume it
        if (audioContext.state === 'suspended') {
          console.log('Resuming suspended AudioContext');
          audioContext.resume();
        }
      }
      
      const rippleCount = colorRipples.length;
      const rippleIntensity = Math.min(rippleCount / 8, 1);
      
      // Smooth, slow modulation - even more gentle
      const slowBreath = Math.sin(time * 0.12) * 0.3 + 0.7; // Slower, less variation
      const microVariation = Math.sin(time * 0.3) * 0.15 + 0.85; // Subtler fluctuation
      
      // Gentle overall volume swell with ripples
      const targetVolume = 0.15 + rippleIntensity * 0.06; // Adjusted for new base volume
      masterGain.gain.setTargetAtTime(targetVolume * slowBreath, time, 0.6); // Slower transition
      
      // Subtle filter opening with ripples - wider range for more air
      const targetFilter = 3500 + rippleIntensity * 2000; // More shimmer with ripples
      filterNode.frequency.setTargetAtTime(targetFilter, time, 1.0); // Very smooth transition
      
      // Each voice breathes independently with more variety
      gainNodes.forEach((gain, index) => {
        const voiceIndex = Math.floor(index / 5); // Updated for 5 detuned oscillators per note
        const phase = voiceIndex * 0.6;
        const breathPattern = Math.sin(time * 0.18 + phase) * 0.3 + 0.7; // Gentler breathing
        const rippleBoost = 1 + rippleIntensity * 0.25;
        
        // Differentiate gain based on frequency range
        let baseGain;
        if (voiceIndex < 3) {
          baseGain = 0.015; // Bass voices
        } else if (voiceIndex > 5) {
          baseGain = 0.018; // High voices
        } else {
          baseGain = 0.022; // Middle voices
        }
        
        const targetGain = baseGain * breathPattern * microVariation * rippleBoost;
        gain.gain.setTargetAtTime(targetGain, time, 0.5);
      });
      
      // Very subtle frequency drift for organic feel - less drift for stability
      oscillators.forEach((osc, index) => {
        const drift = Math.sin(time * 0.08 + index * 0.25) * 1.5; // Smaller drift
        const detuneIndex = index % 5; // Updated for 5 detune values
        const currentDetune = [-2, -0.5, 0, 0.5, 2][detuneIndex];
        osc.detune.setTargetAtTime(currentDetune + drift, time, 0.8); // Slower drift
      });
    }
    
    // Continuously monitor and restart audio if needed (every 5 seconds to avoid excessive restarts)
    setInterval(() => {
      if (soundEnabled && audioContext) {
        // Check AudioContext state
        if (audioContext.state === 'suspended') {
          console.log('AudioContext suspended, resuming...');
          audioContext.resume();
        }
        
        // Check if oscillators exist
        if (oscillators.length === 0) {
          console.log('No oscillators found, restarting ambient sound...');
          startAmbientSound();
        } else {
          const elapsed = Math.floor((Date.now() - lastSoundStartTime) / 1000);
          const remaining = 120 - elapsed;
          console.log('Audio check: ' + oscillators.length + ' oscillators running. Time until restart: ' + remaining + 's');
        }
      }
    }, 5000);
    
    // Setup sliders and checkbox
    const enableSoundCheckbox = document.getElementById('enableSound');
    const instrumentSelect = document.getElementById('instrumentSelect');
    const colorfulLinesCheckbox = document.getElementById('colorfulLines');
    const lineSizeSlider = document.getElementById('lineSize');
    const minSpeedSlider = document.getElementById('minSpeed');
    const maxSpeedSlider = document.getElementById('maxSpeed');
    const densitySlider = document.getElementById('density');
    const zoomControlSlider = document.getElementById('zoomControl');
    
    enableSoundCheckbox.addEventListener('change', (e) => {
      soundEnabled = e.target.checked;
      if (soundEnabled) {
        initAudio();
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
      } else {
        if (audioContext) {
          audioContext.suspend();
        }
      }
    });
    
    instrumentSelect.addEventListener('change', (e) => {
      currentInstrument = e.target.value;
      if (soundEnabled && audioContext) {
        startAmbientSound();
      }
    });
    
    colorfulLinesCheckbox.addEventListener('change', (e) => {
      colorfulLines = e.target.checked;
    });
    
    lineSizeSlider.addEventListener('input', (e) => {
      lineSizeMultiplier = parseFloat(e.target.value);
      document.getElementById('lineSizeValue').textContent = lineSizeMultiplier.toFixed(1) + 'x';
    });
    
    minSpeedSlider.addEventListener('input', (e) => {
      minSpeed = parseFloat(e.target.value);
      document.getElementById('minSpeedValue').textContent = minSpeed.toFixed(3);
    });
    
    maxSpeedSlider.addEventListener('input', (e) => {
      maxSpeedBoost = parseFloat(e.target.value);
      document.getElementById('maxSpeedValue').textContent = maxSpeedBoost.toFixed(1) + 'x';

    densitySlider.addEventListener('input', (e) => {

    });
    
    zoomControlSlider.addEventListener('input', (e) => {
      zoom = parseFloat(e.target.value);
      document.getElementById('zoomValue').textContent = zoom.toFixed(2);

    const trailControlSlider = document.getElementById('trailControl');
    trailControlSlider.addEventListener('input', (e) => {
      trailLength = parseFloat(e.target.value);

      const index = Math.round(trailLength * 2); // Map 0-2 to 0-4
      document.getElementById('trailValue').textContent = labels[index];
    });

    // Store active wave influences
    const waves = [];
    
    // Store color ripple waves
    const colorRipples = [];
    
    // Speed wave zones
    const speedWaves = [];
    
    function createSpeedWave() {
      const x = Math.random() * W;
      const y = -200;
      
      speedWaves.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 0.8, // Reduced horizontal drift
        vy: 0.8 + Math.random() * 1.5, // Slower vertical movement
        radius: 300 + Math.random() * 250, // More consistent size
        strength: 1.2 + Math.random() * 1.5, // More moderate strength
        age: 0,
        maxAge: 600 + Math.random() * 400 // More consistent duration
      });
      
      // Don't play sound for spontaneous ripples anymore (melody system handles music)
    }
    
    // Weather patterns
    const weatherPatterns = [];
    
    function createRandomWeatherPattern() {
      const types = ['turbulence', 'calm', 'vortex', 'drift'];
      const type = types[Math.floor(Math.random() * types.length)];
      
      weatherPatterns.push({
        type: type,

    }
    
    // Start with a few patterns
    for (let i = 0; i < 3; i++) {

    }
    
    // Color pattern shapes
    const colorPatterns = [];
    
    function createColorPattern() {
      const shapes = ['circle', 'triangle', 'square', 'hexagon', 'star'];
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      
      colorPatterns.push({
        shape: shape,
        x: Math.random() * W,
        y: -150,
        vx: (Math.random() - 0.5) * 0.8,
        vy: 0.4 + Math.random() * 0.8,
        size: 80 + Math.random() * 120,
        hueShift: Math.random() * 120 - 60, // -60 to +60
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.02,
        age: 0,
        maxAge: 500 + Math.random() * 400
      });
    }
    
    // Start with a few color patterns
    for (let i = 0; i < 2; i++) {
      createColorPattern();
    }
    
    // Color wave sources
    const colorWaveSources = [];
    
    function createColorWaveSource() {
      // Random position on screen edges or anywhere
      let x, y, vx, vy;
      const edge = Math.floor(Math.random() * 4);
      
      switch (edge) {
        case 0: // Top
          x = Math.random() * W;
          y = -100;
          vx = (Math.random() - 0.5) * 2;
          vy = 0.5 + Math.random() * 1.5;
          break;
        case 1: // Right
          x = W + 100;
          y = Math.random() * H;
          vx = -(0.5 + Math.random() * 1.5);
          vy = (Math.random() - 0.5) * 2;
          break;
        case 2: // Bottom
          x = Math.random() * W;
          y = H + 100;
          vx = (Math.random() - 0.5) * 2;
          vy = -(0.5 + Math.random() * 1.5);
          break;
        case 3: // Left
          x = -100;
          y = Math.random() * H;
          vx = 0.5 + Math.random() * 1.5;
          vy = (Math.random() - 0.5) * 2;
          break;
      }
      
      colorWaveSources.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        age: 0,
        maxAge: 800 + Math.random() * 400,
        waveSpeed: 2 + Math.random() * 3
      });
    }
    
    // Start with one color wave source
    createColorWaveSource();
    
    // Melody system - Pachelbel's Canon in D
    const melodies = [
      // Pachelbel's Canon - Main melody (simplified, flowing version)
      // Famous baroque piece with gentle, flowing character
      // x-axis controls articulation/duration: left = short/staccato, right = long/legato
      [
        // Opening phrase - all whole notes for smooth, sustained character
        { noteIndex: 3, x: 0.85 }, // F# - (whole note)
        { noteIndex: 2, x: 0.85 }, // E - (whole note)
        { noteIndex: 1, x: 0.85 }, // D - (whole note)
        { noteIndex: 0, x: 0.85 }, // C# - (whole note)
        
        // Second phrase - continuing the sustained flow
        { noteIndex: 6, x: 0.85 }, // B - (whole note)
        { noteIndex: 5, x: 0.85 }, // A - (whole note)
        { noteIndex: 6, x: 0.85 }, // B - (whole note)
        { noteIndex: 0, x: 0.85 }, // C# - (whole note)
        
        // Third phrase - building up
        { noteIndex: 3, x: 0.65 }, // F# - (half note)
        { noteIndex: 4, x: 0.65 }, // G - (half note)
        { noteIndex: 5, x: 0.65 }, // A - (half note)
        { noteIndex: 4, x: 0.65 }, // G - (half note)
        
        // Fourth phrase - more active with quarter notes
        { noteIndex: 3, x: 0.4 },  // F# - (quarter)
        { noteIndex: 2, x: 0.4 },  // E - (quarter)
        { noteIndex: 1, x: 0.4 },  // D - (quarter)
        { noteIndex: 0, x: 0.85 }, // C# - (whole note - resolution)
      ],
    ];
    
    let currentMelodyIndex = 0;
    let currentNoteInMelody = 0;
    let lastMelodyNoteTime = Date.now();
    const timeBetweenNotes = 800; // milliseconds between notes
    
    function playNextMelodyNote() {
      // Don't play melody if sound is disabled
      if (!soundEnabled) return;
      
      const now = Date.now();
      if (now - lastMelodyNoteTime < timeBetweenNotes) return;
      
      const melody = melodies[currentMelodyIndex];
      const note = melody[currentNoteInMelody];
      
      // Map note index to Y position (0 = high, 11 = low for 12-note scale)
      // Invert so lower noteIndex = higher pitch = lower Y value
      const normalizedY = 1 - (note.noteIndex / 11); // 0 to 1
      const y = H * normalizedY;
      const x = W * note.x;
      
      // Create ripple at this position
      createRipple(x, y);
      
      // Move to next note
      currentNoteInMelody++;
      lastMelodyNoteTime = now;
      
      // If melody finished, move to next melody after a pause
      if (currentNoteInMelody >= melody.length) {
        currentNoteInMelody = 0;
        currentMelodyIndex = (currentMelodyIndex + 1) % melodies.length;
        lastMelodyNoteTime = now + 1200; // Extra pause between melodies
      }
    }
    
    // Function to create a ripple at a specific location
    function createRipple(x, y) {
      // Random direction for asymmetric spread
      const direction = Math.random() * Math.PI * 2;
      const directionalBias = 0.3 + Math.random() * 0.4; // 0.3 to 0.7 bias strength - gentler asymmetry
      
      colorRipples.push({
        x: x,
        y: y,
        age: 0,
        maxAge: 120, // Faster recovery (was 200)
        waveSpeed: 6, // Faster wave speed (was 5)
        direction: direction, // Direction of faster spread
        directionalBias: directionalBias // How much faster in that direction
      });
      
      speedWaves.push({
        x: x,
        y: y,
        vx: 0,
        vy: 0,
        radius: 350, // Smaller radius (was 500)
        strength: 1.5, // Much gentler strength (was 3)
        age: 0,
        maxAge: 150 // Faster recovery (was 250)
      });
      
      // Trigger sound for this ripple
      if (soundEnabled && audioContext) {
        playRippleSound(x, y);
      }
    }

    // Add click handler to create waves
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;
      
      createRipple(clickX, clickY);
    });
    
    // Add mouse drag handler to create ripples while dragging
    let isMouseDown = false;
    let lastRippleX = null;
    let lastRippleY = null;
    const rippleSpacing = 30; // Minimum distance between ripples while dragging
    
    canvas.addEventListener("mousedown", (e) => {
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      lastRippleX = (e.clientX - rect.left) * scaleX;
      lastRippleY = (e.clientY - rect.top) * scaleY;
      createRipple(lastRippleX, lastRippleY);
    });
    
    canvas.addEventListener("mousemove", (e) => {
      if (isMouseDown) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;
        
        // Only create ripple if moved far enough from last ripple
        const dx = mouseX - lastRippleX;
        const dy = mouseY - lastRippleY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist >= rippleSpacing) {
          createRipple(mouseX, mouseY);
          lastRippleX = mouseX;
          lastRippleY = mouseY;
        }
      }
    });
    
    canvas.addEventListener("mouseup", () => {
      isMouseDown = false;
      lastRippleX = null;
      lastRippleY = null;
    });
    
    canvas.addEventListener("mouseleave", () => {
      isMouseDown = false;
      lastRippleX = null;
      lastRippleY = null;
    });
    
    // Add zoom with mouse wheel
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      
      const rect = canvas.getBoundingClientRect();
      const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
      
      const zoomSpeed = 0.1;
      const delta = e.deltaY > 0 ? zoomSpeed : -zoomSpeed;
      const newZoom = Math.max(0.125, Math.min(1, zoom + delta)); // Min zoom 0.125 (least dense), max 1 (most dense)
      
      if (newZoom !== zoom) {
        // Adjust offset to zoom toward mouse position
        const zoomFactor = newZoom / zoom;
        offsetX = mouseX - (mouseX - offsetX) * zoomFactor;
        offsetY = mouseY - (mouseY - offsetY) * zoomFactor;
        zoom = newZoom;
      }
    }, { passive: false });

    function draw() {
      // Calculate base speed multiplier from speed waves
      let baseSpeedMultiplier = 1;
      
      t += minSpeed * baseSpeedMultiplier; // Use slider value
      
      // Calculate trail fade based on trailLength slider
      // trailLength: 0 = very wispy (0.02 opacity), 1 = medium (0.055), 2 = discrete (1.0 = no trails)
      const trailFade = 0.02 + (trailLength * 0.49); // 0.02 at min, 0.51 at mid, 1.0 at max (complete clear)
      
      // Don't clear completely - leave trails based on slider
      ctx.fillStyle = `rgba(0, 0, 0, ${trailFade})`;
      ctx.fillRect(0, 0, W, H);
      
      // Update sound based on ripple activity
      updateSound();
      
      // Play melody notes
      playNextMelodyNote();

      // Update waves
      for (let i = waves.length - 1; i >= 0; i--) {
        waves[i].age++;
        if (waves[i].age > waves[i].maxAge) {
          waves.splice(i, 1);
        }
      }
      
      // Update color ripples
      for (let i = colorRipples.length - 1; i >= 0; i--) {
        colorRipples[i].age++;
        if (colorRipples[i].age > colorRipples[i].maxAge) {
          colorRipples.splice(i, 1);
        }
      }
      
      // Update speed waves
      for (let i = speedWaves.length - 1; i >= 0; i--) {
        const sw = speedWaves[i];
        sw.x += sw.vx;
        sw.y += sw.vy;
        sw.age++;
        
        // Subtle direction changes for moving waves
        if ((sw.vx !== 0 || sw.vy !== 0) && Math.random() < 0.005) { // Less frequent changes
          sw.vx += (Math.random() - 0.5) * 0.3; // Gentler changes
          sw.vy += (Math.random() - 0.5) * 0.3;
          // Keep reasonable speeds
          const speed = Math.sqrt(sw.vx * sw.vx + sw.vy * sw.vy);
          if (speed > 2.5) { // Lower max speed
            sw.vx = (sw.vx / speed) * 2.5;
            sw.vy = (sw.vy / speed) * 2.5;
          }
        }
        
        if (sw.y > H + 400 || sw.age > sw.maxAge) {
          speedWaves.splice(i, 1);
        }
      }
      
      // Don't spawn random speed waves anymore - only from melody and user interaction
      
      // Update weather patterns
      for (let i = weatherPatterns.length - 1; i >= 0; i--) {
        const wp = weatherPatterns[i];
        wp.x += wp.vx;
        wp.y += wp.vy;
        wp.age++;
        wp.rotation += 0.02;
        
        // Subtle direction changes
        if (Math.random() < 0.008) { // Much less frequent
          wp.vx += (Math.random() - 0.5) * 0.25; // Gentler changes
          wp.vy += (Math.random() - 0.5) * 0.25;
          // Keep reasonable speeds
          const speed = Math.sqrt(wp.vx * wp.vx + wp.vy * wp.vy);
          if (speed > 2) { // Lower max speed
            wp.vx = (wp.vx / speed) * 2;
            wp.vy = (wp.vy / speed) * 2;
          }
        }
        
        // Remove if off screen or expired
        if (wp.y > H + 300 || wp.age > wp.maxAge) {
          weatherPatterns.splice(i, 1);
          // Create a new one to maintain variety
          if (Math.random() < 0.4) {
            createRandomWeatherPattern();
          }
        }
      }
      
      // Occasionally spawn new patterns
      if (Math.random() < 0.006 && weatherPatterns.length < 4) { // Reduced max patterns
        createRandomWeatherPattern();
      }
      
      // Update color patterns
      for (let i = colorPatterns.length - 1; i >= 0; i--) {
        const cp = colorPatterns[i];
        cp.x += cp.vx;
        cp.y += cp.vy;
        cp.age++;
        cp.rotation += cp.rotationSpeed;
        
        // Remove if off screen or expired
        if (cp.y > H + 200 || cp.age > cp.maxAge) {
          colorPatterns.splice(i, 1);
          if (Math.random() < 0.5) {
            createColorPattern();
          }
        }
      }
      
      // Occasionally spawn new color patterns
      if (Math.random() < 0.005 && colorPatterns.length < 3) {
        createColorPattern();
      }
      
      // Update color wave sources
      for (let i = colorWaveSources.length - 1; i >= 0; i--) {
        const cws = colorWaveSources[i];
        cws.x += cws.vx;
        cws.y += cws.vy;
        cws.age++;
        
        // Remove if too old or too far off screen
        if (cws.age > cws.maxAge || cws.x < -300 || cws.x > W + 300 || cws.y < -300 || cws.y > H + 300) {
          colorWaveSources.splice(i, 1);
        }
      }
      
      // Calculate visible grid based on zoom
      const spacing = (baseSpacing / zoom) / baseSpacingMultiplier;
      const cols = Math.ceil(W / spacing) + 2;
      const rows = Math.ceil(H / spacing) + 2;
      const startCol = Math.floor(offsetX / spacing);
      const startRow = Math.floor(offsetY / spacing);

      // background glow (adjust based on trail length)
      const glowOpacity = 0.01 + (trailLength * 0.015); // 0.01 at min, 0.025 at mid, 0.04 at max
      const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.55);
      g.addColorStop(0, `rgba(0,0,0,${glowOpacity})`);
      g.addColorStop(1, `rgba(0,0,0,${glowOpacity * 4})`);
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.lineCap = "round";
      
      // Helper function to get color ripple effect at a point
      function getColorRippleEffect(x, y) {
        let rippleStrength = 0;
        
        for (const cr of colorRipples) {
          const dx = x - cr.x;
          const dy = y - cr.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          // Calculate angle from ripple center to point
          const angleToPoint = Math.atan2(dy, dx);
          
          // Calculate how much faster/slower the wave travels in this direction
          const angleDiff = Math.abs(angleToPoint - cr.direction);
          const normalizedAngleDiff = Math.min(angleDiff, Math.PI * 2 - angleDiff); // 0 to PI
          
          // Speed modifier: fastest in direction, slower perpendicular
          const speedModifier = 1 + cr.directionalBias * Math.cos(normalizedAngleDiff);
          
          // Adjust wave radius based on direction
          const adjustedWaveRadius = cr.age * cr.waveSpeed * speedModifier;
          const waveWidth = 50;
          const waveDist = Math.abs(dist - adjustedWaveRadius);
          
          // Check if point is in the wave band
          if (waveDist < waveWidth) {
            const bandIntensity = 1 - (waveDist / waveWidth);
            const progress = cr.age / cr.maxAge;
            const fadeOut = 1 - progress;
            rippleStrength = Math.max(rippleStrength, bandIntensity * fadeOut);
          }
        }
        
        return rippleStrength;
      }
      
      // Helper function to get local speed multiplier
      function getSpeedMultiplier(x, y) {
        let speedMult = 1;
        
        for (const sw of speedWaves) {
          const dx = x - sw.x;
          const dy = y - sw.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < sw.radius) {
            const falloff = 1 - (dist / sw.radius);
            const smoothFalloff = falloff * falloff * falloff; // Cubic falloff for even smoother edges
            const progress = sw.age / sw.maxAge;
            const fadeOut = Math.sin(progress * Math.PI); // Fade in and out
            const smoothFadeOut = fadeOut * fadeOut; // Square for smoother fade
            const speedBoost = smoothFalloff * smoothFadeOut * sw.strength;
            speedMult = Math.max(speedMult, 1 + speedBoost * 0.5 * (maxSpeedBoost / 3)); // Use slider value
          }
        }
        
        return speedMult;
      }

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const gridX = startCol + x;
          const gridY = startRow + y;
          const px = gridX * spacing + spacing * 0.5 - offsetX;
          const py = gridY * spacing + spacing * 0.5 - offsetY;
          
          // Skip if outside canvas
          if (px < -spacing || px > W + spacing || py < -spacing || py > H + spacing) continue;

          // Normal rendering
          renderVector(gridX, gridY, px, py);
        }
      }
      
      // Extract rendering logic into a function
      function renderVector(gridX, gridY, px, py) {

          // Get local speed multiplier
          const localSpeed = getSpeedMultiplier(px, py);
          const speedT = t * localSpeed; // Use local speed for calculations

          // Base wave field with varying patterns
          const patternSelect = Math.sin(speedT * 0.15) * 0.5 + 0.5;
          
          // Pattern 1: Original flowing waves
          const n1 = Math.sin((gridX * 0.3) + speedT * 1.3 + Math.sin(gridY * 0.15 + speedT * 0.4));
          const n2 = Math.cos((gridY * 0.28) - speedT * 1.1 + Math.sin(gridX * 0.1 - speedT * 0.3));
          
          // Pattern 2: Circular/radial waves
          const centerX = W * 0.5 + Math.cos(speedT * 0.3) * W * 0.2;
          const centerY = H * 0.5 + Math.sin(speedT * 0.25) * H * 0.2;
          const distToCenter = Math.sqrt((px - centerX) ** 2 + (py - centerY) ** 2);
          const radialAngle = Math.atan2(py - centerY, px - centerX);
          const n3 = Math.sin(distToCenter * 0.02 - speedT * 2) + Math.cos(radialAngle * 3 + speedT);
          
          // Pattern 3: Grid interference
          const n4 = Math.sin(gridX * 0.4 + speedT) * Math.cos(gridY * 0.4 - speedT * 0.8);
          
          // Blend patterns over time
          const baseAngle = n1 * 1.2 + n2 * 0.9 + n3 * patternSelect * 0.8 + n4 * (1 - patternSelect) * 0.6;
          
          // Add spreading wave effects from clicks
          let waveEffect = 0;
          for (const wave of waves) {
            const dx = px - wave.x;
            const dy = py - wave.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const progress = wave.age / wave.maxAge;
            
            // Wave spreads outward
            const waveSpeed = 4;
            const waveRadius = wave.age * waveSpeed;
            const waveDist = Math.abs(dist - waveRadius);
            const waveWidth = 60;
            
            if (waveDist < waveWidth) {
              const intensity = (1 - progress) * (1 - waveDist / waveWidth);
              const angleFromWave = Math.atan2(dy, dx);
              waveEffect += Math.cos(angleFromWave) * intensity * 1.2;
            }
          }
          
          const angle = baseAngle + waveEffect;

          // Apply color pattern effects
          let patternColorShift = 0;
          
          for (const cp of colorPatterns) {
            const dx = px - cp.x;
            const dy = py - cp.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Check if point is inside the shape
            let insideShape = false;
            const angleToPoint = Math.atan2(dy, dx) - cp.rotation;
            
            switch (cp.shape) {
              case 'circle':
                insideShape = dist < cp.size;
                break;
                
              case 'triangle':
                // Simple triangle approximation
                const triDist = cp.size * (1 + 0.3 * Math.cos(angleToPoint * 3));
                insideShape = dist < triDist;
                break;
                
              case 'square':
                const squareSize = cp.size * 0.8;
                const rotatedX = dx * Math.cos(-cp.rotation) - dy * Math.sin(-cp.rotation);
                const rotatedY = dx * Math.sin(-cp.rotation) + dy * Math.cos(-cp.rotation);
                insideShape = Math.abs(rotatedX) < squareSize && Math.abs(rotatedY) < squareSize;
                break;
                
              case 'hexagon':
                const hexDist = cp.size * (1 + 0.15 * Math.cos(angleToPoint * 6));
                insideShape = dist < hexDist;
                break;
                
              case 'star':
                const starDist = cp.size * (0.5 + 0.5 * (1 + Math.cos(angleToPoint * 5)) / 2);
                insideShape = dist < starDist;
                break;
            }
            
            if (insideShape) {
              const fadeEdge = 1 - (dist / cp.size);
              const smoothFade = fadeEdge * fadeEdge;
              const ageFade = Math.sin((cp.age / cp.maxAge) * Math.PI);
              patternColorShift += cp.hueShift * smoothFade * ageFade;
            }
          }
          
          // Apply weather pattern effects
          let weatherAngleEffect = 0;
          let weatherSizeEffect = 1;
          let weatherColorShift = 0;
          
          for (const wp of weatherPatterns) {
            const dx = px - wp.x;
            const dy = py - wp.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < wp.radius) {
              const falloff = 1 - (dist / wp.radius);
              const smoothFalloff = falloff * falloff * falloff; // Even smoother falloff
              const intensity = smoothFalloff * wp.strength * 0.15; // Much more subtle
              
              switch (wp.type) {
                case 'turbulence':
                  // Very subtle swirling motion with length variation
                  weatherAngleEffect += Math.sin(dist * 0.05 + wp.rotation) * intensity * 0.3;
                  weatherSizeEffect *= 1 + Math.sin(dist * 0.08 + wp.rotation * 2) * intensity * 1.2; // Increased from 0.4
                  break;
                  
                case 'calm':
                  // Barely noticeable organized flow with gentle length waves
                  weatherAngleEffect += Math.sin(wp.rotation) * intensity * 0.15;
                  weatherSizeEffect *= 1 + Math.sin(dist * 0.05 + wp.age * 0.02) * intensity * 0.9; // Increased from 0.3
                  weatherColorShift += intensity * 10;
                  break;
                  
                case 'vortex':
                  // Gentle circular motion with radial length pulses
                  const vortexAngle = Math.atan2(dy, dx) + Math.PI * 0.5;
                  weatherAngleEffect += Math.sin(vortexAngle + dist * 0.02) * intensity * 0.2;
                  weatherSizeEffect *= 1 + Math.cos(dist * 0.1 - wp.age * 0.03) * intensity * 1.5; // Increased from 0.5
                  break;
                  
                case 'drift':
                  // Subtle directional push with flowing length waves
                  const driftAngle = Math.atan2(wp.vy, wp.vx);
                  weatherAngleEffect += Math.sin(driftAngle) * intensity * 0.15;
                  const flowDirection = Math.cos(driftAngle) * dx + Math.sin(driftAngle) * dy;
                  weatherSizeEffect *= 1 + Math.sin(flowDirection * 0.03 + wp.age * 0.02) * intensity * 1.2; // Increased from 0.4
                  weatherColorShift -= intensity * 8;
                  break;
              }
            }
          }
          
          const finalAngle = angle + weatherAngleEffect;

          // magnitude / brightness
          const mag = (Math.sin(gridX * 0.25 + speedT * 1.1) + Math.cos(gridY * 0.21 - speedT * 1.3)) * 0.35 + 0.65;
          
          // Apply color ripple effect for length boost
          const rippleStrength = getColorRippleEffect(px, py);
          const rippleLengthBoost = 1 + (rippleStrength * 1.5); // Increase length by up to 150% in ripple
          
          const len = (12 + mag * 16) * weatherSizeEffect * lineSizeMultiplier * rippleLengthBoost / zoom; // Apply line size multiplier and ripple boost

          // position offset (makes it look liquid)
          const ox = Math.sin(speedT * 0.7 + gridY * 0.3) * 4;
          const oy = Math.cos(speedT * 0.6 + gridX * 0.25) * 4;

          const x1 = px + ox - Math.cos(finalAngle) * (len * 0.5);
          const y1 = py + oy - Math.sin(finalAngle) * (len * 0.5);
          const x2 = px + ox + Math.cos(finalAngle) * (len * 0.5);
          const y2 = py + oy + Math.sin(finalAngle) * (len * 0.5);

          // Apply color wave sources
          let colorWaveShift = 0;
          
          for (const cws of colorWaveSources) {
            const dx = px - cws.x;
            const dy = py - cws.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const waveRadius = cws.age * cws.waveSpeed;
            
            // Create expanding wave of color change
            const waveWidth = 150;
            const waveDist = Math.abs(dist - waveRadius);
            
            if (waveDist < waveWidth) {
              const bandIntensity = 1 - (waveDist / waveWidth);
              const progress = cws.age / cws.maxAge;
              const fadeOut = Math.sin(progress * Math.PI); // Fade in and out
              colorWaveShift += 120 * bandIntensity * fadeOut; // Shift hue by up to 120 degrees
            }
          }
          
          // More varied primary colors
          const baseHue = (gridX * 3 + gridY * 2.5 + t * 40 + weatherColorShift + patternColorShift + colorWaveShift) % 360; // Increased variation
          
          // Expand primary color ranges for more variety
          let primaryHue;
          if (baseHue < 90) {
            primaryHue = baseHue * 0.5; // 0-45 red to orange
          } else if (baseHue < 180) {
            primaryHue = 60 + (baseHue - 90) * 1.0; // 60-150 yellow to green
          } else if (baseHue < 270) {
            primaryHue = 150 + (baseHue - 180) * 1.0; // 150-240 cyan to blue
          } else {
            primaryHue = 240 + (baseHue - 270) * 1.33; // 240-360 blue to red
          }
          
          const hue = primaryHue;
          const saturation = 35 + mag * 20; // Pastel - lower saturation (was 55 + mag * 30)
          
          // rippleStrength already calculated above for length boost
          let finalHue, finalSat, finalLight;
          
          if (colorfulLines) {
            // Colorful lines mode: ripple creates grayscale contrast
            if (rippleStrength > 0) {
              // Ripple shows as bright grayscale in color mode
              const boostedLight = (60 + mag*25) + (rippleStrength * 25); // Add up to 25% brightness
              ctx.strokeStyle = `hsla(0, 0%, ${boostedLight}%, ${0.6 + mag*0.4})`;
            } else {
              ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${60 + mag*25}%, ${0.6 + mag*0.4})`;
            }
          } else {
            // Grayscale lines mode: ripple brings color
            if (rippleStrength > 0) {
              // Ripple shows as color in grayscale mode
              const boostedSat = saturation + (rippleStrength * 40); // Add up to 40% saturation
              const boostedLight = (60 + mag*25) + (rippleStrength * 20); // Add up to 20% brightness
              ctx.strokeStyle = `hsla(${hue}, ${boostedSat}%, ${boostedLight}%, ${0.6 + mag*0.4})`;
            } else {
              // Grayscale
              ctx.strokeStyle = `hsla(0, 0%, ${60 + mag*25}%, ${0.6 + mag*0.4})`;
            }
          }
          
          ctx.lineWidth = (1.8 - mag * 0.6) * lineSizeMultiplier / zoom;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          // little head on the end
          ctx.beginPath();
          ctx.arc(x2, y2, (1.4 + mag*1.1) * lineSizeMultiplier / zoom, 0, Math.PI*2);
          
          if (colorfulLines) {
            // Colorful lines mode: ripple creates grayscale contrast
            if (rippleStrength > 0) {
              // Ripple shows as bright grayscale in color mode
              const boostedLight = (65 + mag*25) + (rippleStrength * 25); // Add up to 25% brightness
              ctx.fillStyle = `hsla(0, 0%, ${boostedLight}%, ${0.5 + mag*0.4})`;
            } else {
              ctx.fillStyle = `hsla(${hue}, ${saturation + 15}%, ${65 + mag*25}%, ${0.5 + mag*0.4})`;
            }
          } else {
            // Grayscale lines mode: ripple brings color
            if (rippleStrength > 0) {
              // Ripple shows as color in grayscale mode
              const boostedSat = (saturation + 15) + (rippleStrength * 45); // Add up to 45% saturation
              const boostedLight = (65 + mag*25) + (rippleStrength * 20); // Add up to 20% brightness
              ctx.fillStyle = `hsla(${hue}, ${boostedSat}%, ${boostedLight}%, ${0.5 + mag*0.4})`;
            } else {
              // Grayscale
              ctx.fillStyle = `hsla(0, 0%, ${65 + mag*25}%, ${0.5 + mag*0.4})`;
            }
          }
          
          ctx.fill();
      } // End of renderVector function

      requestAnimationFrame(draw);
    }

    // Don't initialize audio on page load - wait for user to enable sound
    // initAudio();
    
    draw();
  </script>
</body>
