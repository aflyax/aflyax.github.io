<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top-Down Hierarchy Worlds (Shaded Inner Balls)</title>
  <style>
    :root {
      --bg: #111;
      --line-color: #aaa;
    }
    body {
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
    }
    svg {
      width: 620px;
      height: 720px;
      overflow: visible;
    }
  </style>
</head>
<body>
  <svg id="scene" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
    <line id="line-0" x1="200" y1="90" x2="200" y2="200" stroke="#aaa" stroke-width="3" stroke-linecap="round" />
    <line id="line-1" x1="200" y1="200" x2="200" y2="310" stroke="#aaa" stroke-width="3" stroke-linecap="round" />
    <line id="line-2" x1="200" y1="310" x2="200" y2="420" stroke="#aaa" stroke-width="3" stroke-linecap="round" />
    <line id="line-3" x1="200" y1="420" x2="200" y2="530" stroke="#aaa" stroke-width="3" stroke-linecap="round" />

    <circle id="node-0" cx="200" cy="90"  r="80" fill="black" stroke="white" stroke-width="2.5" />
    <circle id="node-1" cx="200" cy="200" r="80" fill="white" stroke="white" stroke-width="2.5" />
    <circle id="node-2" cx="200" cy="310" r="80" fill="red"   stroke="white" stroke-width="2.5" />
    <circle id="node-3" cx="200" cy="420" r="80" fill="green" stroke="white" stroke-width="2.5" />
    <circle id="node-4" cx="200" cy="530" r="80" fill="blue"  stroke="white" stroke-width="2.5" />
  </svg>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("scene");
    const baseY = [90, 200, 310, 420, 530];
    const centerX = 200;
    const worldRadius = 80;
    const worldColors = [
      "rgb(0,0,0)",
      "rgb(255,255,255)",
      "rgb(255,0,0)",
      "rgb(0,128,0)",
      "rgb(0,0,255)",
    ];
    const wobbleAmps = [7, 10, 13, 10, 8];
    const wobbleSpeeds = [1.8, 2.0, 2.2, 2.0, 1.9];
    const worldNodes = baseY.map((_, i) => document.getElementById(`node-${i}`));
    const worldLines = [
      document.getElementById("line-0"),
      document.getElementById("line-1"),
      document.getElementById("line-2"),
      document.getElementById("line-3"),
    ];

    function makeShades(rgbStr, count) {
      const m = rgbStr.match(/rgb\((\d+),(\d+),(\d+)\)/);
      let r = +m[1], g = +m[2], b = +m[3];
      const shades = [];
      for (let i = 0; i < count; i++) {
        const t = 0.25 + (i / (count - 1)) * 0.75;
        const rs = Math.round(r * t + 255 * (1 - t) * 0.05);
        const gs = Math.round(g * t + 255 * (1 - t) * 0.05);
        const bs = Math.round(b * t + 255 * (1 - t) * 0.05);
        shades.push(`rgb(${rs},${gs},${bs})`);
      }
      return shades;
    }

    const INNER_COUNT = 10;
    const INNER_R = 7;
    const innerWorlds = [];

    baseY.forEach((y, worldIdx) => {
      const shades = makeShades(worldColors[worldIdx], INNER_COUNT);
      const balls = [];
      const lines = [];

      for (let i = 0; i < INNER_COUNT; i++) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", centerX);
        line.setAttribute("y1", y);
        line.setAttribute("x2", centerX);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "#777");
        line.setAttribute("stroke-width", "1.3");
        svg.appendChild(line);

        const c = document.createElementNS(SVG_NS, "circle");
        const angle = Math.random() * Math.PI * 2;
        const rad = (worldRadius - INNER_R - 6) * Math.sqrt(Math.random());
        const bx = centerX + Math.cos(angle) * rad;
        const by = y + Math.sin(angle) * rad;
        c.setAttribute("cx", bx);
        c.setAttribute("cy", by);
        c.setAttribute("r", INNER_R);
        c.setAttribute("fill", shades[i]);
        c.setAttribute("stroke", "black");
        c.setAttribute("stroke-width", "1");
        svg.appendChild(c);

        const speed = 120 + Math.random() * 90;
        const dir = Math.random() * Math.PI * 2;
        const vx = Math.cos(dir) * speed;
        const vy = Math.sin(dir) * speed;

        balls.push({
          el: c,
          line: line,
          x: bx,
          y: by,
          vx,
          vy,
          prevTime: null,
        });
        lines.push(line);
      }

      innerWorlds.push({ balls, lines });
    });

    function animate(ts) {
      const t = ts / 1000;
      const currentY = [];

      worldNodes.forEach((node, i) => {
        const ny = baseY[i] + Math.sin(t * wobbleSpeeds[i] + i * 0.5) * wobbleAmps[i];
        node.setAttribute("cx", centerX);
        node.setAttribute("cy", ny);
        currentY[i] = ny;
      });

      worldLines.forEach((line, i) => {
        line.setAttribute("x1", centerX);
        line.setAttribute("x2", centerX);
        line.setAttribute("y1", currentY[i]);
        line.setAttribute("y2", currentY[i + 1]);
      });

      innerWorlds.forEach((world, worldIdx) => {
        const wcx = centerX;
        const wcy = currentY[worldIdx];
        const maxR = worldRadius - INNER_R - 3;

        world.balls.forEach(ball => {
          if (ball.prevTime == null) ball.prevTime = t;
          const dt = Math.min(t - ball.prevTime, 0.04);
          ball.prevTime = t;

          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          let dx = ball.x - wcx;
          let dy = ball.y - wcy;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > maxR) {
            const overlap = dist - maxR;
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x -= nx * overlap;
            ball.y -= ny * overlap;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
          }

          ball.el.setAttribute("cx", ball.x);
          ball.el.setAttribute("cy", ball.y);

          ball.line.setAttribute("x1", wcx);
          ball.line.setAttribute("y1", wcy);
          ball.line.setAttribute("x2", ball.x);
          ball.line.setAttribute("y2", ball.y);
        });
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
