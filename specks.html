<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Dust – Torus, Wind, Repulsion</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #151521 0%, #050509 35%, #000000 80%);
      background-size: 140% 140%;
      animation: bgShift 40s ease-in-out infinite alternate;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    canvas { display: block; }

    @keyframes bgShift {
      0%   { background-position: 50% 0%; }
      50%  { background-position: 50% 100%; }
      100% { background-position: 50% 50%; }
    }

    .toggle-controls {
      position: fixed;
      top: 6px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #eee;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 4px #000;
    }
    .toggle-controls input {
      margin: 0;
    }

    .controls {
      position: fixed;
      top: 32px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.35);
      color: #eee;
      font-size: 12px;
      border-radius: 8px;
      max-width: 260px;
      z-index: 10;
      text-shadow: 0 0 4px #000;
      pointer-events: auto;
    }
    .controls h2 {
      margin: 0 0 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }
    .group-title {
      margin-top: 6px;
      margin-bottom: 2px;
      font-weight: 600;
      font-size: 11px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .row label {
      width: 70px;
      font-weight: 600;
    }
    .row input[type="range"] {
      flex: 1;
    }
    .value {
      width: 44px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
    }
  </style>
</head>
<body>

<label class="toggle-controls">
  <input type="checkbox" id="toggleControls" />
  Show controls
</label>

<div class="controls" id="controlsPanel">
  <h2>Box, Speed, Torus</h2>

  <div class="group-title">Bounds (half-size)</div>
  <div class="row">
    <label>X max</label>
    <input id="boxX" type="range" min="20" max="100" value="100" step="1">
    <span class="value" id="boxXVal">100</span>
  </div>
  <div class="row">
    <label>Y max</label>
    <input id="boxY" type="range" min="15" max="70" value="70" step="1">
    <span class="value" id="boxYVal">70</span>
  </div>
  <div class="row">
    <label>Z max</label>
    <input id="boxZ" type="range" min="20" max="80" value="80" step="1">
    <span class="value" id="boxZVal">80</span>
  </div>

  <div class="group-title">Speed factor</div>
  <div class="row">
    <label>Speed X</label>
    <input id="speedX" type="range" min="0.2" max="2.0" value="1.0" step="0.05">
    <span class="value" id="speedXVal">1.00</span>
  </div>
  <div class="row">
    <label>Speed Y</label>
    <input id="speedY" type="range" min="0.2" max="2.0" value="1.0" step="0.05">
    <span class="value" id="speedYVal">1.00</span>
  </div>
  <div class="row">
    <label>Speed Z</label>
    <input id="speedZ" type="range" min="0.2" max="2.0" value="1.5" step="0.05">
    <span class="value" id="speedZVal">1.50</span>
  </div>

  <div class="group-title">Torus attractor</div>
  <div class="row">
    <label>Major R</label>
    <input id="shellR" type="range" min="8" max="40" value="20" step="1">
    <span class="value" id="shellRVal">20</span>
  </div>
  <div class="row">
    <label>Lifetime</label>
    <input id="attrLife" type="range" min="5" max="60" value="18" step="1">
    <span class="value" id="attrLifeVal">18s</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ===== CONFIG (slider-controlled) =====
  let BOX_X = 100;
  let BOX_Y = 70;
  let BOX_Z = 80;

  let SHELL_RADIUS  = 20;   // torus major radius
  let ATTR_LIFETIME = 18.0; // seconds

  // faster defaults in X/Y
  let speedFactorX = 1.0;
  let speedFactorY = 1.0;
  let speedFactorZ = 1.5;

  const PARTICLE_COUNT   = 6000;
  const ATTR_RANGE       = 40;
  const ATTR_RANGE_SQ    = ATTR_RANGE * ATTR_RANGE;

  // torus shape
  const TORUS_MINOR_RATIO = 0.4;  // tube radius = ratio * major R
  const TORUS_K_SURFACE   = 8.0;  // spring to surface
  const TANGENTIAL_FORCE  = 6.0;  // swirl strength

  // one-shot snap lerp
  const SNAP_POS_FACTOR  = 0.6;
  const SNAP_SWIRL       = 10.0;

  // base motion (gentle dust)
  const JITTER           = 0.03;
  const MAX_SPEED        = 0.14;
  const MIN_SPEED        = 0.018;

  // wind: gentle path bending
  const WIND_STRENGTH   = 0.004;
  const WIND_FREQ       = 0.08;
  const WIND_TIME_SPEED = 0.35;

  // repulsion
  const REPULSION_RADIUS    = 4.0;
  const REPULSION_RADIUS_SQ = REPULSION_RADIUS * REPULSION_RADIUS;
  const REPULSION_STRENGTH  = 0.09;
  const FLASH_DECAY         = 4.0;
  const CELL_SIZE           = REPULSION_RADIUS * 1.5;
  let spatialHash = new Map();

  // torus axis: tilted so we get obvious 3D donuts
  const TORUS_AXIS = new THREE.Vector3(0.3, 1.0, 0.4).normalize();

  // orthonormal basis for torus coordinates (U, V in plane, AXIS normal)
  const TORUS_U = new THREE.Vector3();
  const TORUS_V = new THREE.Vector3();
  (function buildBasis() {
    const tmp = new THREE.Vector3(0, 1, 0);
    if (Math.abs(TORUS_AXIS.dot(tmp)) > 0.9) tmp.set(1, 0, 0);
    TORUS_U.crossVectors(TORUS_AXIS, tmp).normalize();
    TORUS_V.crossVectors(TORUS_AXIS, TORUS_U).normalize();
  })();

  // ===== UI HOOKUP =====
  const controlsPanel    = document.getElementById('controlsPanel');
  const toggleControlsEl = document.getElementById('toggleControls');

  function applyToggleState() {
    controlsPanel.style.display = toggleControlsEl.checked ? 'block' : 'none';
  }
  toggleControlsEl.addEventListener('change', applyToggleState);
  applyToggleState();

  const boxXSlider   = document.getElementById('boxX');
  const boxYSlider   = document.getElementById('boxY');
  const boxZSlider   = document.getElementById('boxZ');
  const speedXSlider = document.getElementById('speedX');
  const speedYSlider = document.getElementById('speedY');
  const speedZSlider = document.getElementById('speedZ');
  const shellRSlider = document.getElementById('shellR');
  const attrLifeSlider = document.getElementById('attrLife');

  const boxXVal   = document.getElementById('boxXVal');
  const boxYVal   = document.getElementById('boxYVal');
  const boxZVal   = document.getElementById('boxZVal');
  const speedXVal = document.getElementById('speedXVal');
  const speedYVal = document.getElementById('speedYVal');
  const speedZVal = document.getElementById('speedZVal');
  const shellRVal = document.getElementById('shellRVal');
  const attrLifeVal = document.getElementById('attrLifeVal');

  function updateBox() {
    BOX_X = parseFloat(boxXSlider.value);
    BOX_Y = parseFloat(boxYSlider.value);
    BOX_Z = parseFloat(boxZSlider.value);
    boxXVal.textContent = BOX_X.toFixed(0);
    boxYVal.textContent = BOX_Y.toFixed(0);
    boxZVal.textContent = BOX_Z.toFixed(0);
  }
  function updateSpeed() {
    speedFactorX = parseFloat(speedXSlider.value);
    speedFactorY = parseFloat(speedYSlider.value);
    speedFactorZ = parseFloat(speedZSlider.value);
    speedXVal.textContent = speedFactorX.toFixed(2);
    speedYVal.textContent = speedFactorY.toFixed(2);
    speedZVal.textContent = speedFactorZ.toFixed(2);
  }
  function updateShell() {
    SHELL_RADIUS = parseFloat(shellRSlider.value);
    shellRVal.textContent = SHELL_RADIUS.toFixed(0);
  }
  function updateAttrLife() {
    ATTR_LIFETIME = parseFloat(attrLifeSlider.value);
    attrLifeVal.textContent = ATTR_LIFETIME.toFixed(0) + 's';
  }

  boxXSlider.addEventListener('input', updateBox);
  boxYSlider.addEventListener('input', updateBox);
  boxZSlider.addEventListener('input', updateBox);
  speedXSlider.addEventListener('input', updateSpeed);
  speedYSlider.addEventListener('input', updateSpeed);
  speedZSlider.addEventListener('input', updateSpeed);
  shellRSlider.addEventListener('input', updateShell);
  attrLifeSlider.addEventListener('input', updateAttrLife);

  updateBox();
  updateSpeed();
  updateShell();
  updateAttrLife();

  // ===== THREE SETUP =====
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    500
  );
  camera.position.set(0, 0, 140);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ===== PARTICLES =====
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const colors    = new Float32Array(PARTICLE_COUNT * 3);
  const flash     = new Float32Array(PARTICLE_COUNT); // for repulsion flashes

  const particles = []; // { position, velocity, boostTimer, slowTimer }

  const baseColor = new THREE.Color(1.0, 0.9, 0.3);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const pos = new THREE.Vector3(
      (Math.random() * 2 - 1) * BOX_X * 0.7,
      (Math.random() * 2 - 1) * BOX_Y * 0.7,
      (Math.random() * 2 - 1) * BOX_Z * 0.7
    );
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 0.3,
      (Math.random() - 0.5) * 0.3,
      (Math.random() - 0.5) * 0.3
    );

    particles.push({ position: pos, velocity: vel, boostTimer: 0, slowTimer: 0 });

    const i3 = i * 3;
    positions[i3]     = pos.x;
    positions[i3 + 1] = pos.y;
    positions[i3 + 2] = pos.z;

    const t = 0.85 + Math.random() * 0.15;
    colors[i3]     = baseColor.r * t;
    colors[i3 + 1] = baseColor.g * t;
    colors[i3 + 2] = baseColor.b * t;

    flash[i] = 0.0;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color",    new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute("flash",    new THREE.BufferAttribute(flash, 1));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0.0 }
    },
    vertexShader: `
      attribute vec3 color;
      attribute float flash;
      varying vec3 vColor;
      varying float vFlash;
      uniform float uTime;

      void main() {
        vColor = color;
        vFlash = flash;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        float shimmer = 0.8 + 0.2 * sin(
          uTime * 1.5 + position.x * 0.15 + position.y * 0.18 + position.z * 0.12
        );
        float baseSize = 2.2;
        gl_PointSize = baseSize * shimmer * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vFlash;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        float r2 = dot(c, c);
        if (r2 > 0.25) discard;
        float d = sqrt(r2);
        float alphaCore = 1.0 - smoothstep(0.0, 0.5, d);

        vec3 col = vColor * 1.7;
        float f = clamp(vFlash, 0.0, 1.0);
        col = mix(col, vec3(1.0, 1.0, 1.0), f);

        float alpha = alphaCore * (1.0 + 0.6 * f);

        gl_FragColor = vec4(col, alpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const points = new THREE.Points(geometry, material);
  scene.add(points);

  // ===== ATTRACTORS (TORUS) =====
  const attractors = []; // { center: Vector3, age: number, life: number }

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // Snap nearby particles toward random points on torus surface
  function createAttractor(center) {
    const a = { center: center.clone(), age: 0.0, life: ATTR_LIFETIME };
    attractors.push(a);

    const R = SHELL_RADIUS;
    const r = SHELL_RADIUS * TORUS_MINOR_RATIO;

    const rel       = new THREE.Vector3();
    const targetPos = new THREE.Vector3();
    const radialDir = new THREE.Vector3();
    const radial2D  = new THREE.Vector2();
    const tangMajor = new THREE.Vector3();

    for (const p of particles) {
      rel.copy(p.position).sub(center);
      if (rel.lengthSq() > ATTR_RANGE_SQ) continue;

      // random torus parameters
      const u = Math.random() * Math.PI * 2.0;
      const v = Math.random() * Math.PI * 2.0;

      const cosu = Math.cos(u), sinu = Math.sin(u);
      const cosv = Math.cos(v), sinv = Math.sin(v);

      const ringDir = radialDir
        .copy(TORUS_U).multiplyScalar(cosu)
        .addScaledVector(TORUS_V, sinu) // direction in torus plane
        .normalize();

      const majorCenter = center.clone().addScaledVector(ringDir, R + r * cosv);
      targetPos.copy(majorCenter).addScaledVector(TORUS_AXIS, r * sinv);

      p.position.lerp(targetPos, SNAP_POS_FACTOR);

      // swirl velocity along major ring
      const vParticle = p.velocity;
      tangMajor.crossVectors(TORUS_AXIS, ringDir).normalize();
      vParticle.addScaledVector(tangMajor, SNAP_SWIRL);
    }
  }

  // click only if not on UI
  window.addEventListener("click", (event) => {
    if (event.target.closest('.controls') || event.target.closest('.toggle-controls')) {
      return;
    }

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const ray = raycaster.ray;

    const t = (0 - ray.origin.z) / ray.direction.z;
    const center = ray.origin.clone().add(ray.direction.clone().multiplyScalar(t));

    createAttractor(center);
  });

  // Continuous attraction toward torus surface (closest point approx)
  function applyAttractors(dt) {
    if (!attractors.length) return;

    const R = SHELL_RADIUS;
    const r = SHELL_RADIUS * TORUS_MINOR_RATIO;

    const rel         = new THREE.Vector3();
    const radialDir3D = new THREE.Vector3();
    const tangMajor   = new THREE.Vector3();
    const normalWorld = new THREE.Vector3();

    for (const p of particles) {
      const v = p.velocity;

      for (const a of attractors) {
        if (a.age > a.life) continue;

        rel.copy(p.position).sub(a.center);
        if (rel.lengthSq() > ATTR_RANGE_SQ) continue;

        // coordinates in torus basis
        const x = rel.dot(TORUS_U);
        const y = rel.dot(TORUS_AXIS); // along axis
        const z = rel.dot(TORUS_V);

        const radialLenXZ = Math.sqrt(x*x + z*z) || 1e-6;
        const dirX = x / radialLenXZ;
        const dirZ = z / radialLenXZ;

        // center of the tube circle at this azimuth
        const cx = R * dirX;
        const cz = R * dirZ;
        const cy = 0;

        // vector from tube center to point
        const dx = x - cx;
        const dy = y - cy;
        const dz = z - cz;
        const distTube = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1e-6;

        const nx = dx / distTube;
        const ny = dy / distTube;
        const nz = dz / distTube;

        const radialError = distTube - r;

        // normal in world coords
        normalWorld
          .copy(TORUS_U).multiplyScalar(nx)
          .addScaledVector(TORUS_AXIS, ny)
          .addScaledVector(TORUS_V, nz)
          .normalize();

        const accel = -TORUS_K_SURFACE * radialError;
        v.addScaledVector(normalWorld, accel * dt);

        const vNorm = v.dot(normalWorld);
        v.addScaledVector(normalWorld, -vNorm * 0.6 * dt); // damping

        // swirl along major ring direction
        radialDir3D
          .copy(TORUS_U).multiplyScalar(dirX)
          .addScaledVector(TORUS_V, dirZ)
          .normalize();

        tangMajor.crossVectors(TORUS_AXIS, radialDir3D).normalize();
        v.addScaledVector(tangMajor, TANGENTIAL_FORCE * dt);
      }
    }
  }

  // ===== WIND: gentle path bending =====
  function applyWindAll(dt, time) {
    const scale = WIND_STRENGTH * dt * 60.0;
    if (scale <= 0) return;

    for (const p of particles) {
      const v = p.velocity;
      const speedSq = v.lengthSq();
      if (speedSq <= 1e-10) continue;

      const speed = Math.sqrt(speedSq);
      const vx = v.x / speed;
      const vy = v.y / speed;
      const vz = v.z / speed;

      const phase = time * WIND_TIME_SPEED;
      const wx = Math.sin(p.position.y * WIND_FREQ + phase * 0.9);
      const wy = Math.sin(p.position.z * WIND_FREQ + phase * 1.1);
      const wz = Math.sin(p.position.x * WIND_FREQ + phase * 0.7);

      const dot = wx*vx + wy*vy + wz*vz;
      let px = wx - dot * vx;
      let py = wy - dot * vy;
      let pz = wz - dot * vz;

      const plenSq = px*px + py*py + pz*pz;
      if (plenSq <= 1e-10) continue;

      const invPl = 1.0 / Math.sqrt(plenSq);
      px *= invPl; py *= invPl; pz *= invPl;

      v.x += px * scale;
      v.y += py * scale;
      v.z += pz * scale;

      const newLenSq = v.lengthSq();
      if (newLenSq > 1e-10) {
        const newLen = Math.sqrt(newLenSq);
        const k = speed / newLen;
        v.multiplyScalar(k);
      }
    }
  }

  // ===== REPULSION (forward-only, with flash) =====
  function buildSpatialHash() {
    spatialHash.clear();
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const ix = Math.floor(p.position.x / CELL_SIZE);
      const iy = Math.floor(p.position.y / CELL_SIZE);
      const iz = Math.floor(p.position.z / CELL_SIZE);
      const key = ix + ',' + iy + ',' + iz;
      let bucket = spatialHash.get(key);
      if (!bucket) {
        bucket = [];
        spatialHash.set(key, bucket);
      }
      bucket.push(i);
    }
  }

  function applyRepulsionAll(dt) {
    if (REPULSION_RADIUS <= 0 || spatialHash.size === 0) return;
    const base = REPULSION_STRENGTH * dt * 60.0;

    for (const bucket of spatialHash.values()) {
      const len = bucket.length;
      if (len <= 1) continue;

      for (let ai = 0; ai < len; ai++) {
        const i = bucket[ai];
        const p = particles[i];
        for (let bi = ai + 1; bi < len; bi++) {
          const j = bucket[bi];
          const q = particles[j];

          const dx = q.position.x - p.position.x;
          const dy = q.position.y - p.position.y;
          const dz = q.position.z - p.position.z;
          const distSq = dx*dx + dy*dy + dz*dz;
          if (distSq > 0 && distSq < REPULSION_RADIUS_SQ) {
            const dist = Math.sqrt(distSq);
            const falloff = 1.0 - dist / REPULSION_RADIUS;
            const impulse = base * falloff;

            let vpx = p.velocity.x;
            let vpy = p.velocity.y;
            let vpz = p.velocity.z;
            const vplenSq = vpx*vpx + vpy*vpy + vpz*vpz;
            if (vplenSq > 1e-10) {
              const invVp = 1.0 / Math.sqrt(vplenSq);
              p.velocity.x += vpx * invVp * impulse;
              p.velocity.y += vpy * invVp * impulse;
              p.velocity.z += vpz * invVp * impulse;
            }

            let vqx = q.velocity.x;
            let vqy = q.velocity.y;
            let vqz = q.velocity.z;
            const vqlenSq = vqx*vqx + vqy*vqy + vqz*vqz;
            if (vqlenSq > 1e-10) {
              const invVq = 1.0 / Math.sqrt(vqlenSq);
              q.velocity.x += vqx * invVq * impulse;
              q.velocity.y += vqy * invVq * impulse;
              q.velocity.z += vqz * invVq * impulse;
            }

            p.boostTimer = 0.35;
            p.slowTimer  = 0.70;
            q.boostTimer = 0.35;
            q.slowTimer  = 0.70;

            flash[i] = 1.0;
            flash[j] = 1.0;
          }
        }
      }
    }
  }

  // ===== MOTION & BOUNDS =====
  function integrate(dt) {
    const jitterScale = JITTER * dt * 60;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const pos = p.position;
      const v   = p.velocity;

      flash[i] *= Math.exp(-FLASH_DECAY * dt);

      let moveFactor = 1.0;
      if (p.boostTimer > 0) {
        moveFactor = 1.6;
        p.boostTimer -= dt;
        if (p.boostTimer < 0) p.boostTimer = 0;
      } else if (p.slowTimer > 0) {
        moveFactor = 0.6;
        p.slowTimer -= dt;
        if (p.slowTimer < 0) p.slowTimer = 0;
      }

      v.x += (Math.random() - 0.5) * jitterScale;
      v.y += (Math.random() - 0.5) * jitterScale;
      v.z += (Math.random() - 0.5) * jitterScale;

      let speedSq = v.lengthSq();
      if (speedSq > 0) {
        const speed = Math.sqrt(speedSq);
        if (speed > MAX_SPEED) {
          v.multiplyScalar(MAX_SPEED / speed);
        } else if (speed < MIN_SPEED) {
          v.multiplyScalar(MIN_SPEED / speed);
        }
      }

      const step = dt * 60 * moveFactor;
      pos.x += v.x * step * speedFactorX;
      pos.y += v.y * step * speedFactorY;
      pos.z += v.z * step * speedFactorZ;

      const bounceJitter = 0.2;

      if (pos.x > BOX_X) {
        pos.x = BOX_X;
        if (v.x > 0) v.x = -v.x;
        v.y += (Math.random() - 0.5) * bounceJitter;
        v.z += (Math.random() - 0.5) * bounceJitter;
      } else if (pos.x < -BOX_X) {
        pos.x = -BOX_X;
        if (v.x < 0) v.x = -v.x;
        v.y += (Math.random() - 0.5) * bounceJitter;
        v.z += (Math.random() - 0.5) * bounceJitter;
      }

      if (pos.y > BOX_Y) {
        pos.y = BOX_Y;
        if (v.y > 0) v.y = -v.y;
        v.x += (Math.random() - 0.5) * bounceJitter;
        v.z += (Math.random() - 0.5) * bounceJitter;
      } else if (pos.y < -BOX_Y) {
        pos.y = -BOX_Y;
        if (v.y < 0) v.y = -v.y;
        v.x += (Math.random() - 0.5) * bounceJitter;
        v.z += (Math.random() - 0.5) * bounceJitter;
      }

      if (pos.z > BOX_Z) {
        pos.z = BOX_Z;
        if (v.z > 0) v.z = -v.z;
        v.x += (Math.random() - 0.5) * bounceJitter;
        v.y += (Math.random() - 0.5) * bounceJitter;
      } else if (pos.z < -BOX_Z) {
        pos.z = -BOX_Z;
        if (v.z < 0) v.z = -v.z;
        v.x += (Math.random() - 0.5) * bounceJitter;
        v.y += (Math.random() - 0.5) * bounceJitter;
      }

      const i3 = i * 3;
      positions[i3]     = pos.x;
      positions[i3 + 1] = pos.y;
      positions[i3 + 2] = pos.z;
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.flash.needsUpdate    = true;
  }

  // ===== LOOP =====
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    let dt = clock.getDelta();
    if (dt > 0.05) dt = 0.05;
    const time = clock.elapsedTime;

    for (let i = attractors.length - 1; i >= 0; i--) {
      attractors[i].age += dt;
      if (attractors[i].age > attractors[i].life) {
        attractors.splice(i, 1);
      }
    }

    buildSpatialHash();
    applyRepulsionAll(dt);
    applyAttractors(dt);
    applyWindAll(dt, time);
    integrate(dt);

    material.uniforms.uTime.value += dt;
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
